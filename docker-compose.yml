version: '3.8'

services:
  db:
    image: postgres:16
    container_name: wst_postgres
    environment:
      POSTGRES_USER: wst
      POSTGRES_PASSWORD: wst_dev_only
      POSTGRES_DB: wst
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wst"]
      interval: 5s
      retries: 10

volumes:
  dbdata: