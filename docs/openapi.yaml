openapi: 3.0.0
info:
  title: BUA DevHub API Documentation
  description: Workshop Management & Student Practical Training (WST) — 94 project endpoints + health check
  version: 1.0.0
servers:
  - url: https://abdelmasih-maher-backend.vercel.app
    description: Production (Vercel + Neon)
  - url: http://localhost:5000
    description: Local dev
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Courses
  - name: Tasks
  - name: Assessments
  - name: Enrollments
  - name: Attendance
  - name: Certificates
  - name: Halls
  - name: Customers
  - name: Vehicles
  - name: Bays
  - name: JobCards
  - name: WorkItems
  - name: Labor
  - name: BayBookings
  - name: Parts
  - name: Stock
  - name: Purchasing
  - name: Invoices
  - name: Sessions
  - name: Dashboards
  - name: Exports
  - name: Predictions
  - name: Attachments
  - name: Notifications
  - name: Students
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: UNAUTHORIZED
            message:
              type: string
              example: Access token is missing or invalid
            requestId:
              type: string
              example: req_1716400000000
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [WORKSHOP_MANAGER, SERVICE_ADVISOR, TECHNICIAN, QUALITY_CHECKER, STOREKEEPER, PROCUREMENT, TRAINING_SUPERVISOR, MENTOR, STUDENT, FINANCE_VIEWER, AUDITOR, CUSTOMER]
        phone:
          type: string
        store_code:
          type: string
        student_code:
          type: string
        preferred_language:
          type: string
        is_active:
          type: boolean
    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: AI
        name:
          type: object
          example: {en: Artificial Intelligence, ar: الذكاء الاصطناعي}
        required_sessions:
          type: integer
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        competency_code:
          type: string
        competency_name:
          type: object
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        training_session_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        practical_task_id:
          type: string
          format: uuid
        result:
          type: string
          enum: [PASS, FAIL, NEEDS_IMPROVEMENT]
        entered_by:
          type: string
          format: uuid
    Enrollment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        group_code:
          type: string
          example: AI-G1
    Attendance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        training_session_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PRESENT, ABSENT, LATE, EXCUSED]
        recorded_by:
          type: string
          format: uuid
    Certificate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        token:
          type: string
        status:
          type: string
    HallBooking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hall_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        source:
          type: string
        training_session_id:
          type: string
          format: uuid
    Customer:
      type: object
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        full_name: {type: string}
        role: {type: string, example: CUSTOMER}
        phone: {type: string}
        contact_preference: {type: string}
    Vehicle:
      type: object
      properties:
        id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        plate_number: {type: string}
        vin: {type: string}
        make: {type: string}
        model: {type: string}
        year: {type: integer}
        current_mileage: {type: integer}
        next_service_date: {type: string, format: date}
        next_service_mileage: {type: integer}
        service_interval_km: {type: integer}
    Bay:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string, example: Bay 1}
        kind: {type: string, example: WORKSHOP}
        is_active: {type: boolean}
    JobCard:
      type: object
      properties:
        id: {type: string, format: uuid}
        job_number: {type: string}
        vehicle_id: {type: string, format: uuid}
        service_type: {type: string}
        priority: {type: string}
        complaint: {type: string}
        mileage_in: {type: integer}
        stage: {type: string, enum: [RECEIVED, IN_PROGRESS, QUALITY_CHECK, READY, DELIVERED]}
        bay_id: {type: string, format: uuid}
        technician_id: {type: string, format: uuid}
        advisor_id: {type: string, format: uuid}
    WorkItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        job_card_id: {type: string, format: uuid}
        description: {type: string}
        is_billable: {type: boolean}
        approval: {type: string, enum: [PENDING, APPROVED, DECLINED]}
        status: {type: string}
    LaborEntry:
      type: object
      properties:
        id: {type: string, format: uuid}
        job_card_id: {type: string, format: uuid}
        work_item_id: {type: string, format: uuid}
        technician_id: {type: string, format: uuid}
        minutes: {type: integer}
        note: {type: string}
    BayBooking:
      type: object
      properties:
        id: {type: string, format: uuid}
        bay_id: {type: string, format: uuid}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        source: {type: string, enum: [JOB, SESSION]}
    Part:
      type: object
      properties:
        id: {type: string, format: uuid}
        sku: {type: string}
        name: {type: object}
        category: {type: string}
        unit: {type: string}
        average_cost: {type: number}
        min_level: {type: integer}
        max_level: {type: integer}
    PurchaseOrder:
      type: object
      properties:
        id: {type: string, format: uuid}
        po_number: {type: string}
        vendor_name: {type: string}
        status: {type: string}
        total_amount: {type: number}
    Invoice:
      type: object
      properties:
        id: {type: string, format: uuid}
        invoice_number: {type: string}
        job_card_id: {type: string, format: uuid}
        status: {type: string}
        total_amount: {type: number}
    TrainingSession:
      type: object
      properties:
        id: {type: string, format: uuid}
        course_id: {type: string, format: uuid}
        group_code: {type: string}
        hall_id: {type: string, format: uuid}
        mentor_id: {type: string, format: uuid}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        status: {type: string}
paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Server is running
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email + password (1/94)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, example: supervisor@example.com}
                password: {type: string, example: password123}
      responses:
        '200': {description: accessToken + refreshToken + user}
        '401': {description: Invalid credentials, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user (2/94)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, password]
              properties:
                full_name: {type: string}
                email: {type: string}
                password: {type: string}
      responses:
        '201': {description: Created}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Email conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens with a valid refreshToken (rotates both tokens)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: {type: string}
      responses:
        '200': {description: New accessToken + refreshToken + user}
        '400': {description: refreshToken missing, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Invalid or expired refresh token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: User disabled, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user (3/94)
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current user}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password-reset token (15 min, emailed in production)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string}
      responses:
        '200': {description: Generic message + resetToken (demo only)}
        '400': {description: Email missing, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with a reset token (min 6 chars)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, newPassword]
              properties:
                resetToken: {type: string}
                newPassword: {type: string, minLength: 6}
      responses:
        '200': {description: Password has been reset}
        '400': {description: Fields missing/short password, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Invalid or expired reset token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/users:
    get:
      tags: [Users]
      summary: List all users (4/94)
      security: [{bearerAuth: []}]
      responses:
        '200': {description: User list}
        '401': {description: Unauthorized, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get user by id (5/94)
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: User}
        '404': {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    put:
      tags: [Users]
      summary: Update user (6/94)
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: {type: string}
                email: {type: string}
                role: {type: string, description: Assigned by an authorized manager}
                phone: {type: string}
                preferred_language: {type: string}
                is_active: {type: boolean}
      responses:
        '200': {description: Updated user}
        '403': {description: Only an authorized manager can assign roles}
        '404': {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [Users]
      summary: Deactivate user (soft delete) (7/94)
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Deactivated}
        '404': {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/courses:
    get:
      tags: [Courses]
      summary: List courses (8/94)
      responses:
        '200': {description: Course list}
    post:
      tags: [Courses]
      summary: Create course (9/94)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, example: AI}
                name: {type: object, example: {en: Artificial Intelligence, ar: الذكاء الاصطناعي}}
                name_en: {type: string}
                name_ar: {type: string}
                required_sessions: {type: integer}
      responses:
        '201': {description: Created}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/courses/{id}:
    get:
      tags: [Courses]
      summary: Get course by id (10/94)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Course}
        '404': {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    put:
      tags: [Courses]
      summary: Update course (11/94)
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Course'}
      responses:
        '200': {description: Updated}
        '404': {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [Courses]
      summary: Delete course (12/94)
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Deleted}
        '404': {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/tasks:
    get:
      tags: [Tasks]
      summary: List practical tasks, optional ?course_id= (13/94)
      parameters:
        - {name: course_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Task list}
    post:
      tags: [Tasks]
      summary: Create practical task (14/94)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [course_id, title, competency_code]
              properties:
                course_id: {type: string, format: uuid}
                title: {type: string}
                description: {type: string}
                competency_code: {type: string}
                competency_name: {type: object}
      responses:
        '201': {description: Created}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/tasks/{id}:
    get:
      tags: [Tasks]
      summary: Get task by id (15/94)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Task}
        '404': {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    put:
      tags: [Tasks]
      summary: Update task (16/94)
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Task'}
      responses:
        '200': {description: Updated}
        '404': {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [Tasks]
      summary: Delete task (17/94)
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Deleted}
        '404': {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/assessments:
    get:
      tags: [Assessments]
      summary: List assessments, optional ?student_id=&training_session_id= (18/94)
      parameters:
        - {name: student_id, in: query, schema: {type: string, format: uuid}}
        - {name: training_session_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Assessment list}
    post:
      tags: [Assessments]
      summary: Create assessment result (19/94)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [training_session_id, student_id, practical_task_id, result]
              properties:
                training_session_id: {type: string, format: uuid}
                student_id: {type: string, format: uuid}
                practical_task_id: {type: string, format: uuid}
                result: {type: string, enum: [PASS, FAIL, NEEDS_IMPROVEMENT]}
                time_on_task_minutes: {type: integer}
                mentor_note: {type: string}
                entered_by: {type: string, format: uuid, description: defaults to authenticated user}
      responses:
        '201': {description: Created}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/enrollments:
    get:
      tags: [Enrollments]
      summary: List enrollments, optional ?student_id=&course_id= (20/94)
      parameters:
        - {name: student_id, in: query, schema: {type: string, format: uuid}}
        - {name: course_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Enrollment list}
    post:
      tags: [Enrollments]
      summary: Enroll student (21/94)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_id, course_id, group_code]
              properties:
                student_id: {type: string, format: uuid}
                course_id: {type: string, format: uuid}
                group_code: {type: string, example: AI-G1}
      responses:
        '201': {description: Created}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Already enrolled, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/enrollments/{id}:
    delete:
      tags: [Enrollments]
      summary: Delete enrollment (22/94)
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Deleted}
        '404': {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/attendance:
    get:
      tags: [Attendance]
      summary: List attendance, optional ?training_session_id=&student_id= (23/94)
      parameters:
        - {name: training_session_id, in: query, schema: {type: string, format: uuid}}
        - {name: student_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Attendance list}
    post:
      tags: [Attendance]
      summary: Record attendance (upsert per session+student) (24/94)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [training_session_id, student_id, status]
              properties:
                training_session_id: {type: string, format: uuid}
                student_id: {type: string, format: uuid}
                status: {type: string, enum: [PRESENT, ABSENT, LATE, EXCUSED]}
                recorded_by: {type: string, format: uuid, description: defaults to authenticated user}
      responses:
        '201': {description: Recorded}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/certificates/user/{id}:
    get:
      tags: [Certificates]
      summary: Get certificates for a student (25/94)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}, description: student_id}
      responses:
        '200': {description: Certificate list}
  /api/v1/certificates:
    post:
      tags: [Certificates]
      summary: Issue certificate (26/94)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_id, course_id]
              properties:
                student_id: {type: string, format: uuid}
                course_id: {type: string, format: uuid}
                token: {type: string, description: auto-generated when omitted}
      responses:
        '201': {description: Issued}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/halls/bookings:
    get:
      tags: [Halls]
      summary: List hall bookings, optional ?hall_id= (27/94)
      parameters:
        - {name: hall_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Booking list}
    post:
      tags: [Halls]
      summary: Create hall booking with overlap guard (28/94)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hall_id, starts_at, ends_at]
              properties:
                hall_id: {type: string, format: uuid}
                starts_at: {type: string, format: date-time}
                ends_at: {type: string, format: date-time}
                training_session_id: {type: string, format: uuid}
      responses:
        '201': {description: Booked}
        '400': {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Time-slot conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/halls/bookings/{id}:
    patch:
      tags: [Halls]
      summary: Reschedule a hall booking (overlap guard excludes itself)
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                starts_at: {type: string, format: date-time}
                ends_at: {type: string, format: date-time}
                training_session_id: {type: string, format: uuid}
      responses:
        '200': {description: Updated booking}
